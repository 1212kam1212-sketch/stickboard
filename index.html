  :root {
    --void: #06070b;
    --panel: #0f141d;
    --panel-hi: #141b27;
    --panel-edge: #1f2938;
    --text: #eaf0fb;
    --text-dim: #7c8aa5;
    --text-faint: #4c5871;

    --accent: 53 231 199;
    --danger: 255 77 109;
    --warn: 255 176 32;
    --quiet: 124 138 165;

    --n-yellow: 232 255 61;
    --n-pink: 255 61 158;
    --n-orange: 255 122 61;
    --n-mint: 61 255 176;
    --n-blue: 61 199 255;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--void);
    background-image: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(53,231,199,0.10), transparent 60%);
    color: var(--text);
    font-family: 'Rajdhani', 'Segoe UI', sans-serif;
    font-weight: 500;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(10px, 3vw, 30px);
  }

  h1, h2, .display {
    font-family: 'Orbitron', 'Rajdhani', sans-serif;
    font-weight: 700;
  }

  /* ---------- header ---------- */
  .topbar {
    width: 100%;
    max-width: 1240px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    padding: 4px 6px 22px;
    flex-wrap: wrap;
  }
  .topbar h1 {
    margin: 0;
    font-size: clamp(1.7rem, 4vw, 2.6rem);
    letter-spacing: 0.06em;
    color: var(--text);
    line-height: 1;
    animation: titleGlow 3.6s ease-in-out infinite;
  }
  @keyframes titleGlow {
    0%, 100% { text-shadow: 0 0 16px rgba(53,231,199,0.5), 0 0 38px rgba(53,231,199,0.22); }
    50% { text-shadow: 0 0 24px rgba(53,231,199,0.8), 0 0 56px rgba(53,231,199,0.38); }
  }
  @media (prefers-reduced-motion: reduce) {
    .topbar h1 { animation: none; text-shadow: 0 0 18px rgba(53,231,199,0.55), 0 0 40px rgba(53,231,199,0.25); }
  }
  .topbar .tagline {
    margin: 6px 0 0;
    color: var(--text-dim);
    font-size: 1rem;
    letter-spacing: 0.03em;
    font-weight: 500;
  }
  .topbar .header-left { display: flex; flex-direction: column; }

  .btn-new {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: rgb(var(--accent) / 12%);
    color: rgb(var(--accent));
    border: 1px solid rgb(var(--accent) / 55%);
    border-radius: 6px;
    padding: 11px 20px;
    cursor: pointer;
    box-shadow: 0 0 0 1px rgb(var(--accent) / 8%), 0 0 22px rgb(var(--accent) / 15%);
    transition: box-shadow .18s ease, background-color .18s ease, transform .12s ease;
  }
  .btn-new:hover { background: rgb(var(--accent) / 20%); box-shadow: 0 0 0 1px rgb(var(--accent) / 15%), 0 0 30px rgb(var(--accent) / 30%); transform: translateY(-1px); }
  .btn-new:active { transform: translateY(0); }
  .btn-new:focus-visible { outline: 2px solid rgb(var(--accent)); outline-offset: 2px; }

  .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn-bell {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 0.92rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: rgba(255,255,255,0.04);
    color: var(--text-dim);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    padding: 10px 16px;
    cursor: pointer;
    transition: box-shadow .18s ease, background-color .18s ease, color .18s ease, border-color .18s ease;
  }
  .btn-bell[aria-pressed="true"] {
    background: rgb(var(--accent) / 12%);
    color: rgb(var(--accent));
    border-color: rgb(var(--accent) / 55%);
    box-shadow: 0 0 18px rgb(var(--accent) / 15%);
  }
  .btn-bell:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-bell:hover:not(:disabled) { color: var(--text); border-color: rgb(var(--accent) / 40%); }
  .btn-bell:focus-visible { outline: 2px solid rgb(var(--accent)); outline-offset: 2px; }

  /* ---------- board ---------- */
  .board {
    width: 100%;
    max-width: 1240px;
    flex: 1;
    background-color: var(--panel);
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px),
      radial-gradient(ellipse 700px 400px at 50% 0%, rgba(53,231,199,0.06), transparent 65%);
    background-size: 36px 36px, 36px 36px, 100% 100%;
    border: 1px solid var(--panel-edge);
    border-radius: 14px;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.02),
      0 0 60px rgba(53,231,199,0.05),
      0 24px 60px rgba(0,0,0,0.55);
    padding: 26px 20px 40px;
  }

  .zones {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 980px) {
    .zones { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .zones { grid-template-columns: 1fr; }
  }

  .zone {
    background: rgba(255,255,255,0.015);
    border: 1px solid rgba(255,255,255,0.06);
    border-left: 3px solid rgb(var(--zc));
    border-radius: 10px;
    padding: 4px 4px 10px;
  }
  .zone[data-section="priorities"] { --zc: var(--danger); }
  .zone[data-section="coming-up"] { --zc: var(--warn); }
  .zone[data-section="todo"] { --zc: var(--accent); }
  .zone[data-section="someday"] { --zc: var(--quiet); }

  .zone__tag {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 12px 10px;
  }
  .zone__title {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 0.98rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .zone__glyph { color: rgb(var(--zc)); font-size: 0.85rem; }
  .zone__count {
    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.78rem;
    color: var(--text-faint);
  }

  .zone__body {
    min-height: 150px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: flex-start;
    align-content: flex-start;
    padding: 4px 8px 10px;
    border-radius: 8px;
    transition: background-color .15s ease;
  }
  .zone__body.drag-over { background-color: rgb(var(--zc) / 8%); }

  .zone__empty {
    font-family: 'Rajdhani', sans-serif;
    color: var(--text-faint);
    font-size: 0.95rem;
    text-align: center;
    padding: 16px 8px;
    width: 100%;
  }

  /* ---------- notes ---------- */
  .note {
    --rot: 0deg;
    position: relative;
    width: 208px;
    min-height: 138px;
    padding: 16px 13px 12px;
    background:
      radial-gradient(circle at 14% 12%, rgb(var(--nc) / 16%), transparent 55%),
      linear-gradient(160deg, rgb(var(--nc) / 10%), var(--panel-hi) 65%);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 500;
    font-size: 1.06rem;
    line-height: 1.32;
    border: 1px solid rgb(var(--nc) / 45%);
    border-radius: 9px;
    box-shadow: 0 0 0 1px rgb(var(--nc) / 10%), 0 10px 26px rgb(var(--nc) / 18%), 0 2px 8px rgba(0,0,0,0.4);
    transform: rotate(var(--rot));
    transition: transform .15s ease, box-shadow .15s ease;
    cursor: grab;
    overflow: hidden;
  }
  .note::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: rgb(var(--nc));
    box-shadow: 0 0 10px rgb(var(--nc) / 80%);
  }
  .note:hover, .note:focus-within {
    transform: rotate(0deg) translateY(-4px) scale(1.02);
    box-shadow: 0 0 0 1px rgb(var(--nc) / 30%), 0 14px 34px rgb(var(--nc) / 30%), 0 4px 10px rgba(0,0,0,0.5);
    z-index: 5;
  }
  .note.dragging { opacity: 0.35; }

  .note--yellow { --nc: var(--n-yellow); }
  .note--pink   { --nc: var(--n-pink); }
  .note--orange { --nc: var(--n-orange); }
  .note--mint   { --nc: var(--n-mint); }
  .note--blue   { --nc: var(--n-blue); }

  .note__controls {
    position: absolute;
    top: 8px; right: 8px;
    display: flex;
    gap: 4px;
  }
  .note__icon-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 50%;
    width: 22px; height: 22px;
    font-size: 0.82rem;
    line-height: 1;
    cursor: pointer;
    color: var(--text-dim);
    opacity: 0;
    transition: opacity .15s ease, background-color .15s ease, color .15s ease;
  }
  .note:hover .note__icon-btn, .note:focus-within .note__icon-btn { opacity: 1; }
  .note__icon-btn:hover { background: rgb(var(--nc) / 25%); color: var(--text); }
  .note__icon-btn:focus-visible { outline: 2px solid rgb(var(--accent)); opacity: 1; }

  .note__check {
    position: absolute;
    top: 8px; left: 8px;
    display: block;
    width: 22px; height: 22px;
    cursor: pointer;
  }
  .note__check input {
    position: absolute;
    opacity: 0;
    width: 22px; height: 22px;
    margin: 0;
    cursor: pointer;
  }
  .note__checkmark {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgb(var(--nc) / 65%);
    background: rgb(var(--nc) / 10%);
    transition: background-color .15s ease, box-shadow .15s ease;
  }
  .note__check input:checked ~ .note__checkmark {
    background: rgb(var(--nc));
    border-color: rgb(var(--nc));
    box-shadow: 0 0 12px rgb(var(--nc) / 80%);
  }
  .note__check input:checked ~ .note__checkmark::after {
    content: '';
    position: absolute;
    left: 6px; top: 2px;
    width: 6px; height: 11px;
    border: solid var(--void);
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }
  .note__check input:focus-visible ~ .note__checkmark { outline: 2px solid rgb(var(--accent)); outline-offset: 2px; }

  .note.note--done {
    transform: rotate(var(--rot)) scale(0.82);
    opacity: 0;
    filter: blur(4px);
    transition: transform .28s ease, opacity .28s ease, filter .28s ease;
  }
  @media (prefers-reduced-motion: reduce) {
    .note.note--done { filter: none; }
  }

  .note__text {
    margin: 8px 0 12px;
    word-break: break-word;
    white-space: pre-wrap;
  }

  .note__footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    flex-wrap: wrap;
  }
  .note__badge {
    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.72rem;
    letter-spacing: 0.01em;
    padding: 3px 8px;
    border-radius: 20px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgb(var(--nc) / 40%);
    color: var(--text-dim);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .note__badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgb(var(--nc));
    box-shadow: 0 0 5px rgb(var(--nc) / 90%);
  }
  .note__badge--soon { color: rgb(var(--warn)); border-color: rgb(var(--warn) / 55%); }
  .note__badge--soon::before { background: rgb(var(--warn)); box-shadow: 0 0 6px rgb(var(--warn) / 90%); }
  .note__badge--overdue {
    color: #fff;
    background: rgb(var(--danger) / 22%);
    border-color: rgb(var(--danger) / 70%);
    font-weight: 700;
    text-transform: uppercase;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .note__badge--overdue::before { background: rgb(var(--danger)); box-shadow: 0 0 6px rgb(var(--danger)); }
  @media (prefers-reduced-motion: reduce) { .note__badge--overdue { animation: none; } }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgb(var(--danger) / 55%); } 50% { box-shadow: 0 0 0 6px rgb(var(--danger) / 0%); } }

  .note__move {
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.75rem;
    background: transparent;
    border: none;
    color: var(--text-faint);
    opacity: 0.6;
    cursor: pointer;
    max-width: 84px;
  }
  .note__move:hover, .note__move:focus-visible { opacity: 1; color: var(--text-dim); }

  /* ---------- modal ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(3,5,9,0.7);
    backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .overlay[hidden] { display: none; }

  .modal {
    width: 100%;
    max-width: 420px;
    background: var(--panel-hi);
    border: 1px solid rgb(var(--accent) / 35%);
    border-radius: 10px;
    padding: 22px 22px 20px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 0 60px rgb(var(--accent) / 12%), 0 25px 60px rgba(0,0,0,0.6);
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 {
    margin: 0 0 16px;
    font-size: 1.15rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgb(var(--accent));
  }
  .field { margin-bottom: 15px; }
  .field label {
    display: block;
    font-size: 0.92rem;
    letter-spacing: 0.02em;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .modal textarea {
    width: 100%;
    min-height: 70px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 500;
    font-size: 1.1rem;
    padding: 10px;
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    background: rgba(0,0,0,0.3);
    color: var(--text);
    resize: vertical;
  }
  .modal textarea::placeholder { color: var(--text-faint); }
  .modal textarea:focus-visible, .modal select:focus-visible, .modal input:focus-visible { outline: 2px solid rgb(var(--accent)); outline-offset: 1px; }

  .swatches { display: flex; gap: 10px; }
  .swatch {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
    box-shadow: 0 0 8px rgb(var(--sc) / 60%);
  }
  .swatch[aria-pressed="true"] { border-color: var(--text); box-shadow: 0 0 14px rgb(var(--sc) / 90%); }
  .swatch--yellow { --sc: var(--n-yellow); background: rgb(var(--n-yellow)); }
  .swatch--pink { --sc: var(--n-pink); background: rgb(var(--n-pink)); }
  .swatch--orange { --sc: var(--n-orange); background: rgb(var(--n-orange)); }
  .swatch--mint { --sc: var(--n-mint); background: rgb(var(--n-mint)); }
  .swatch--blue { --sc: var(--n-blue); background: rgb(var(--n-blue)); }

  .toggle-row { display: flex; align-items: center; gap: 8px; }
  .toggle-row input { width: 17px; height: 17px; accent-color: rgb(var(--accent)); }
  .toggle-row label { margin: 0; font-size: 1rem; color: var(--text); }

  .deadline-detail[hidden] { display: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 8px; }
  .chip {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 500;
    font-size: 0.92rem;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--panel-edge);
    border-radius: 20px;
    padding: 6px 13px;
    cursor: pointer;
    color: var(--text-dim);
  }
  .chip:hover { border-color: rgb(var(--accent) / 60%); color: var(--text); }
  .chip[aria-pressed="true"] { background: rgb(var(--accent) / 16%); border-color: rgb(var(--accent)); color: rgb(var(--accent)); }

  .custom-row { display: flex; gap: 8px; align-items: center; margin-top: 6px; color: var(--text-dim); }
  .custom-row input[type="number"] {
    width: 64px; padding: 7px; border: 1px solid var(--panel-edge); border-radius: 6px; font-family: inherit; font-size: 1rem; background: rgba(0,0,0,0.3); color: var(--text);
  }
  .custom-row select { padding: 7px; border: 1px solid var(--panel-edge); border-radius: 6px; font-family: inherit; font-size: 1rem; background: rgba(0,0,0,0.3); color: var(--text); }
  .or-line { font-size: 0.85rem; color: var(--text-faint); margin: 12px 0 6px; }
  .modal input[type="datetime-local"] {
    width: 100%; padding: 8px; border: 1px solid var(--panel-edge); border-radius: 6px; font-family: inherit; font-size: 0.95rem; background: rgba(0,0,0,0.3); color: var(--text);
    color-scheme: dark;
  }

  .section-select {
    width: 100%; padding: 9px; border: 1px solid var(--panel-edge); border-radius: 6px; font-family: 'Rajdhani', sans-serif; font-size: 1rem; background: rgba(0,0,0,0.3); color: var(--text);
  }

  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .btn-cancel {
    background: none; border: none; font-family: 'Rajdhani', sans-serif; font-size: 1rem; color: var(--text-faint); cursor: pointer; padding: 8px 10px;
  }
  .btn-cancel:hover { color: var(--text-dim); }
  .btn-save {
    font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 1rem; letter-spacing: 0.06em; text-transform: uppercase;
    background: rgb(var(--accent) / 16%); color: rgb(var(--accent)); border: 1px solid rgb(var(--accent) / 70%); border-radius: 6px;
    padding: 9px 20px; cursor: pointer;
    box-shadow: 0 0 18px rgb(var(--accent) / 20%);
  }
  .btn-save:hover { background: rgb(var(--accent) / 26%); box-shadow: 0 0 26px rgb(var(--accent) / 35%); }
  .btn-save:active { transform: translateY(1px); }
  .btn-remove-deadline { background: none; border: none; color: rgb(var(--danger)); font-family: 'Rajdhani', sans-serif; font-size: 0.9rem; cursor: pointer; text-decoration: underline; padding: 0; margin-top: 8px; }

  /* ---------- toast ---------- */
  .toast {
    position: fixed;
    left: 50%; bottom: 22px;
    transform: translateX(-50%) translateY(20px);
    background: var(--panel-hi);
    border: 1px solid rgb(var(--accent) / 45%);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.95rem;
    padding: 9px 18px;
    border-radius: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 100;
    box-shadow: 0 0 24px rgb(var(--accent) / 20%), 0 6px 16px rgba(0,0,0,0.5);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .urgent-banner {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    background: rgb(var(--danger) / 16%);
    border-bottom: 1px solid rgb(var(--danger) / 60%);
    backdrop-filter: blur(6px);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    padding: 12px 20px;
    box-shadow: 0 0 30px rgb(var(--danger) / 25%);
    transform: translateY(-100%);
    transition: transform .28s ease;
  }
  .urgent-banner[hidden] { display: none; }
  .urgent-banner.show { transform: translateY(0); }
  .urgent-banner__glyph { color: rgb(var(--danger)); font-size: 1.1rem; }
  .urgent-banner__label {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: rgb(var(--danger));
  }
  #urgentBannerText { color: var(--text); }
  #urgentBannerClose {
    background: none; border: none; color: var(--text-dim); font-size: 1.2rem; line-height: 1; cursor: pointer; padding: 2px 6px; margin-left: 6px;
  }
  #urgentBannerClose:hover { color: var(--text); }
  #urgentBannerClose:focus-visible { outline: 2px solid rgb(var(--accent)); }

  .board-empty {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--text-faint);
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.3rem;
    letter-spacing: 0.04em;
    padding: 34px 10px;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
</style>

  <div class="topbar">
    <div class="header-left">
      <h1>STICKBOARD</h1>
      <p class="tagline">Stick it. Track it. Ship it.</p>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-bell" id="notifyBtn" aria-pressed="true">🔔 Sound Alerts On</button>
      <button type="button" class="btn-new" id="newNoteBtn">+ New Note</button>
    </div>
  </div>

  <main class="board" aria-label="Priority board">
    <div class="zones" id="zones">

    </div>
  </main>

  <div class="overlay" id="overlay" hidden>
    <form class="modal" id="noteForm" aria-labelledby="modalTitle">
      <h2 id="modalTitle">New Note</h2>
      <input type="hidden" id="editId" value="">

      <div class="field">
        <label for="noteText">What needs doing?</label>
        <textarea id="noteText" required placeholder="Buy groceries, finish report, call mom..." autofocus></textarea>
      </div>

      <div class="field">
        <label id="colorLabel">Color</label>
        <div class="swatches" role="group" aria-labelledby="colorLabel" id="swatches">
          <button type="button" class="swatch swatch--yellow" data-color="yellow" aria-label="Yellow" aria-pressed="true"></button>
          <button type="button" class="swatch swatch--pink" data-color="pink" aria-label="Pink" aria-pressed="false"></button>
          <button type="button" class="swatch swatch--orange" data-color="orange" aria-label="Orange" aria-pressed="false"></button>
          <button type="button" class="swatch swatch--mint" data-color="mint" aria-label="Mint" aria-pressed="false"></button>
          <button type="button" class="swatch swatch--blue" data-color="blue" aria-label="Blue" aria-pressed="false"></button>
        </div>
      </div>

      <div class="field">
        <div class="toggle-row">
          <input type="checkbox" id="deadlineToggle">
          <label for="deadlineToggle">Give it a deadline</label>
        </div>
        <div class="deadline-detail" id="deadlineDetail" hidden>
          <div class="chips" id="chips">
            <button type="button" class="chip" data-hours="1">1 hour</button>
            <button type="button" class="chip" data-hours="4">4 hours</button>
            <button type="button" class="chip" data-hours="24">1 day</button>
            <button type="button" class="chip" data-hours="72">3 days</button>
            <button type="button" class="chip" data-hours="168">1 week</button>
          </div>
          <div class="custom-row">
            <span>or</span>
            <input type="number" id="customAmount" value="19" aria-label="Custom amount">
            <select id="customUnit" aria-label="Custom unit">
              <option value="hours">hours</option>
              <option value="days">days</option>
            </select>
            <button type="button" class="chip" id="applyCustom">from now</button>
          </div>
          <p class="or-line">or pick an exact time</p>
          <input type="datetime-local" id="exactTime">
          <button type="button" class="btn-remove-deadline" id="removeDeadline" hidden>Remove deadline</button>
        </div>
      </div>

      <div class="field">
        <label for="sectionSelect">Section</label>
        <select class="section-select" id="sectionSelect">
          <option value="priorities">Priorities</option>
          <option value="coming-up">Coming Up</option>
          <option value="todo">To-Do</option>
          <option value="someday">Someday</option>
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn-save">⚡ Stick It</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="urgent-banner" id="urgentBanner" role="alert" hidden>
    <span class="urgent-banner__glyph">▲</span>
    <span class="urgent-banner__label">NOW URGENT —</span>
    <span id="urgentBannerText"></span>
    <button type="button" id="urgentBannerClose" aria-label="Dismiss">×</button>
  </div>

  <script>
  (function () {
    'use strict';

    var SECTIONS = [
      { key: 'priorities', label: 'Priorities', glyph: '▲', hint: 'Handle these first' },
      { key: 'coming-up', label: 'Coming Up', glyph: '◐', hint: 'On the clock' },
      { key: 'todo', label: 'To-Do', glyph: '▪', hint: 'The regular list' },
      { key: 'someday', label: 'Someday', glyph: '○', hint: 'No rush' }
    ];
    var COLORS = ['yellow', 'pink', 'orange', 'mint', 'blue'];
    var STORAGE_KEY = 'stickBoard.notes.v1';

    var state = { notes: [] };
    var artifactCap = null;
    var publishTimer = null;
    var dragNoteId = null;

    /* ---------- utils ---------- */
    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function b64DecodeUnicode(str) {
      return decodeURIComponent(Array.prototype.map.call(atob(str), function (c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
    }

    function nextColor() {
      return COLORS[state.notes.length % COLORS.length];
    }

    function rotationFor(id) {
      var sum = 0;
      for (var i = 0; i < id.length; i++) sum += id.charCodeAt(i);
      return ((sum % 7) - 3) + 'deg';
    }

    function formatDuration(ms) {
      var s = Math.max(0, Math.floor(ms / 1000));
      var d = Math.floor(s / 86400);
      var h = Math.floor((s % 86400) / 3600);
      var m = Math.floor((s % 3600) / 60);
      var sec = s % 60;
      if (d > 0) return d + 'd ' + h + 'h';
      if (h > 0) return h + 'h ' + m + 'm';
      if (m > 0) return m + 'm ' + sec + 's';
      return sec + 's';
    }

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._hideTimer);
      t._hideTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
    }

    /* ---------- alerts ----------
       Real OS/browser Notifications can't be used here: published pages run inside
       claude.ai's sandboxed viewer frame, which blocks the Notification API entirely
       (permission is permanently stuck at "denied", confirmed by testing). A sound +
       an on-screen banner are the reliable alternative inside that sandbox. */
    var notifyBtn = document.getElementById('notifyBtn');
    var SOUND_KEY = 'stickBoard.soundAlerts.v1';
    var soundEnabled = true;
    try { soundEnabled = localStorage.getItem(SOUND_KEY) !== 'off'; } catch (e) {}

    function refreshNotifyButton() {
      notifyBtn.textContent = soundEnabled ? '🔔 Sound Alerts On' : '🔕 Sound Alerts Off';
      notifyBtn.setAttribute('aria-pressed', soundEnabled ? 'true' : 'false');
    }

    notifyBtn.addEventListener('click', function () {
      soundEnabled = !soundEnabled;
      try { localStorage.setItem(SOUND_KEY, soundEnabled ? 'on' : 'off'); } catch (e) {}
      refreshNotifyButton();
      if (soundEnabled) playAlertSound();
    });

    function playAlertSound() {
      try {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        var ctx = new Ctx();
        var now = ctx.currentTime;
        [880, 1320].forEach(function (freq, i) {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          var start = now + i * 0.11;
          gain.gain.setValueAtTime(0, start);
          gain.gain.linearRampToValueAtTime(0.18, start + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.22);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.24);
        });
        setTimeout(function () { ctx.close(); }, 700);
      } catch (e) {}
    }

    /* attention banner: hard to miss, independent of scroll position or toast timing */
    function showUrgentBanner(note) {
      var banner = document.getElementById('urgentBanner');
      document.getElementById('urgentBannerText').textContent = '"' + note.text.slice(0, 60) + '" just became urgent';
      banner.hidden = false;
      requestAnimationFrame(function () { banner.classList.add('show'); });
    }
    document.getElementById('urgentBannerClose').addEventListener('click', function () {
      var banner = document.getElementById('urgentBanner');
      banner.classList.remove('show');
      setTimeout(function () { banner.hidden = true; }, 250);
    });

    function notifyUrgent(note) {
      showToast('"' + note.text.slice(0, 40) + '" just became urgent');
      showUrgentBanner(note);
      if (soundEnabled) playAlertSound();
    }

    /* ---------- persistence ---------- */
    function loadInitialNotes() {
      try {
        var local = localStorage.getItem(STORAGE_KEY);
        if (local) {
          var parsed = JSON.parse(local);
          if (Array.isArray(parsed)) return parsed;
        }
      } catch (e) {}
      try {
        var embedded = document.getElementById('note-data').textContent;
        var parsedEmbedded = JSON.parse(embedded);
        if (Array.isArray(parsedEmbedded)) return parsedEmbedded;
      } catch (e) {}
      return [];
    }

    function saveLocal() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.notes)); } catch (e) {}
    }

    function buildPublishHTML() {
      var tplB64 = document.getElementById('page-template').textContent;
      var tpl = b64DecodeUnicode(tplB64);
      return tpl.replace('__NOTES_JSON_TOKEN__', JSON.stringify(state.notes));
    }

    function schedulePublish() {
      if (!artifactCap) return;
      clearTimeout(publishTimer);
      publishTimer = setTimeout(function () {
        artifactCap.publish(buildPublishHTML()).then(function () {
          showToast('Saved to your board');
        }).catch(function (err) {
          if (err && (err.code === 'not_writer' || err.code === 'not_granted' || err.code === 'not_declared')) {
            artifactCap = null;
          }
        });
      }, 2500);
    }

    function persist() {
      saveLocal();
      schedulePublish();
    }

    /* ---------- rendering ---------- */
    function render() {
      var zonesEl = document.getElementById('zones');
      zonesEl.innerHTML = '';

      if (state.notes.length === 0) {
        var empty = document.createElement('p');
        empty.className = 'board-empty';
        empty.textContent = 'Nothing pinned yet. Add your first note.';
        zonesEl.appendChild(empty);
      }

      SECTIONS.forEach(function (sec) {
        var zone = document.createElement('section');
        zone.className = 'zone';
        zone.dataset.section = sec.key;

        var notesInSection = state.notes.filter(function (n) { return n.section === sec.key; });

        var tag = document.createElement('div');
        tag.className = 'zone__tag';
        tag.innerHTML =
          '<span class="zone__title"><span class="zone__glyph">' + sec.glyph + '</span>' + sec.label + '</span>' +
          '<span class="zone__count">' + notesInSection.length + '</span>';
        zone.appendChild(tag);

        var body = document.createElement('div');
        body.className = 'zone__body';
        body.dataset.section = sec.key;

        if (notesInSection.length === 0) {
          var e = document.createElement('p');
          e.className = 'zone__empty';
          e.textContent = 'Drag a note here, or pin a new one';
          body.appendChild(e);
        } else {
          notesInSection.forEach(function (note) {
            body.appendChild(createNoteCard(note));
          });
        }

        body.addEventListener('dragover', function (ev) {
          ev.preventDefault();
          body.classList.add('drag-over');
        });
        body.addEventListener('dragleave', function () {
          body.classList.remove('drag-over');
        });
        body.addEventListener('drop', function (ev) {
          ev.preventDefault();
          body.classList.remove('drag-over');
          var id = ev.dataTransfer.getData('text/plain');
          moveNote(id, sec.key);
        });

        zone.appendChild(body);
        zonesEl.appendChild(zone);
      });
    }

    function createNoteCard(note) {
      var el = document.createElement('article');
      el.className = 'note note--' + note.color;
      el.style.setProperty('--rot', rotationFor(note.id));
      el.dataset.id = note.id;
      el.draggable = true;

      el.addEventListener('dragstart', function (ev) {
        dragNoteId = note.id;
        el.classList.add('dragging');
        ev.dataTransfer.setData('text/plain', note.id);
        ev.dataTransfer.effectAllowed = 'move';
      });
      el.addEventListener('dragend', function () {
        el.classList.remove('dragging');
      });

      var checkLabel = document.createElement('label');
      checkLabel.className = 'note__check';
      var checkInput = document.createElement('input');
      checkInput.type = 'checkbox';
      checkInput.setAttribute('aria-label', 'Mark "' + note.text.slice(0, 40) + '" done');
      checkInput.addEventListener('change', function () {
        if (checkInput.checked) completeNote(note.id, el);
      });
      var checkmark = document.createElement('span');
      checkmark.className = 'note__checkmark';
      checkLabel.appendChild(checkInput);
      checkLabel.appendChild(checkmark);
      el.appendChild(checkLabel);

      var controls = document.createElement('div');
      controls.className = 'note__controls';
      var editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'note__icon-btn';
      editBtn.setAttribute('aria-label', 'Edit note');
      editBtn.textContent = '✎';
      editBtn.addEventListener('click', function () { openModal(note); });
      var removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'note__icon-btn';
      removeBtn.setAttribute('aria-label', 'Delete note');
      removeBtn.textContent = '×';
      removeBtn.addEventListener('click', function () { deleteNote(note.id); });
      controls.appendChild(editBtn);
      controls.appendChild(removeBtn);
      el.appendChild(controls);

      var text = document.createElement('p');
      text.className = 'note__text';
      text.textContent = note.text;
      el.appendChild(text);

      var footer = document.createElement('div');
      footer.className = 'note__footer';

      if (note.deadline) {
        var badge = document.createElement('span');
        badge.className = 'note__badge';
        badge.dataset.badgeFor = note.id;
        footer.appendChild(badge);
      } else {
        var spacer = document.createElement('span');
        footer.appendChild(spacer);
      }

      var move = document.createElement('select');
      move.className = 'note__move';
      move.setAttribute('aria-label', 'Move note to a different section');
      SECTIONS.forEach(function (sec) {
        var opt = document.createElement('option');
        opt.value = sec.key;
        opt.textContent = sec.label;
        if (sec.key === note.section) opt.selected = true;
        move.appendChild(opt);
      });
      move.addEventListener('change', function () { moveNote(note.id, move.value); });
      footer.appendChild(move);

      el.appendChild(footer);

      if (note.deadline) updateBadge(note, el.querySelector('[data-badge-for="' + note.id + '"]'));

      return el;
    }

    function updateBadge(note, badgeEl) {
      if (!badgeEl) return;
      var diff = note.deadline - Date.now();
      badgeEl.classList.remove('note__badge--soon', 'note__badge--overdue');
      if (diff <= 0) {
        badgeEl.textContent = 'OVERDUE +' + formatDuration(-diff);
        badgeEl.classList.add('note__badge--overdue');
      } else if (diff < 3600000) {
        badgeEl.textContent = formatDuration(diff);
        badgeEl.classList.add('note__badge--soon');
      } else {
        badgeEl.textContent = formatDuration(diff);
      }
    }

    /* ---------- mutations ---------- */
    function moveNote(id, sectionKey) {
      var note = state.notes.find(function (n) { return n.id === id; });
      if (!note || note.section === sectionKey) return;
      note.section = sectionKey;
      render();
      persist();
    }

    function completeNote(id, el) {
      if (el) el.classList.add('note--done');
      setTimeout(function () {
        state.notes = state.notes.filter(function (n) { return n.id !== id; });
        render();
        persist();
      }, 300);
    }

    function deleteNote(id) {
      state.notes = state.notes.filter(function (n) { return n.id !== id; });
      render();
      persist();
    }

    function tick() {
      var now = Date.now();
      var changed = false;
      state.notes.forEach(function (n) {
        if (n.deadline && !n.autoPromoted && n.deadline <= now) {
          n.section = 'priorities';
          n.autoPromoted = true;
          changed = true;
          notifyUrgent(n);
        }
      });
      if (changed) {
        render();
        persist();
      } else {
        state.notes.forEach(function (n) {
          if (n.deadline) {
            var badgeEl = document.querySelector('[data-badge-for="' + n.id + '"]');
            updateBadge(n, badgeEl);
          }
        });
      }
    }

    /* ---------- modal ---------- */
    var overlay = document.getElementById('overlay');
    var form = document.getElementById('noteForm');
    var modalTitle = document.getElementById('modalTitle');
    var editIdInput = document.getElementById('editId');
    var noteTextEl = document.getElementById('noteText');
    var swatchesEl = document.getElementById('swatches');
    var deadlineToggle = document.getElementById('deadlineToggle');
    var deadlineDetail = document.getElementById('deadlineDetail');
    var chipsEl = document.getElementById('chips');
    var customAmount = document.getElementById('customAmount');
    var customUnit = document.getElementById('customUnit');
    var applyCustom = document.getElementById('applyCustom');
    var exactTime = document.getElementById('exactTime');
    var removeDeadlineBtn = document.getElementById('removeDeadline');
    var sectionSelect = document.getElementById('sectionSelect');

    var selectedColor = 'yellow';
    var selectedDeadline = null;

    function setSelectedColor(color) {
      selectedColor = color;
      Array.prototype.forEach.call(swatchesEl.querySelectorAll('.swatch'), function (sw) {
        sw.setAttribute('aria-pressed', sw.dataset.color === color ? 'true' : 'false');
      });
    }

    function toLocalDatetimeValue(ts) {
      var d = new Date(ts - new Date().getTimezoneOffset() * 60000);
      return d.toISOString().slice(0, 16);
    }

    function setSelectedDeadline(ts) {
      selectedDeadline = ts;
      exactTime.value = toLocalDatetimeValue(ts);
      removeDeadlineBtn.hidden = false;
      if (sectionSelect.dataset.userTouched !== 'true') sectionSelect.value = 'coming-up';
    }

    swatchesEl.addEventListener('click', function (ev) {
      var btn = ev.target.closest('.swatch');
      if (btn) setSelectedColor(btn.dataset.color);
    });

    deadlineToggle.addEventListener('change', function () {
      deadlineDetail.hidden = !deadlineToggle.checked;
      if (!deadlineToggle.checked) {
        selectedDeadline = null;
      } else if (!selectedDeadline) {
        setSelectedDeadline(Date.now() + 19 * 3600000);
      }
    });

    chipsEl.addEventListener('click', function (ev) {
      var chip = ev.target.closest('.chip');
      if (!chip) return;
      var hours = parseFloat(chip.dataset.hours);
      setSelectedDeadline(Date.now() + hours * 3600000);
      Array.prototype.forEach.call(chipsEl.querySelectorAll('.chip'), function (c) { c.setAttribute('aria-pressed', c === chip ? 'true' : 'false'); });
    });

    applyCustom.addEventListener('click', function () {
      var amount = parseFloat(customAmount.value) || 0;
      var mult = customUnit.value === 'days' ? 86400000 : 3600000;
      setSelectedDeadline(Date.now() + amount * mult);
    });

    exactTime.addEventListener('change', function () {
      if (exactTime.value) {
        var ts = new Date(exactTime.value).getTime();
        selectedDeadline = ts;
        removeDeadlineBtn.hidden = false;
      }
    });

    removeDeadlineBtn.addEventListener('click', function () {
      selectedDeadline = null;
      exactTime.value = '';
      removeDeadlineBtn.hidden = true;
      Array.prototype.forEach.call(chipsEl.querySelectorAll('.chip'), function (c) { c.setAttribute('aria-pressed', 'false'); });
    });

    sectionSelect.addEventListener('change', function () { sectionSelect.dataset.userTouched = 'true'; });

    function openModal(existingNote) {
      form.reset();
      sectionSelect.dataset.userTouched = 'false';
      selectedDeadline = null;
      deadlineDetail.hidden = true;
      deadlineToggle.checked = false;
      removeDeadlineBtn.hidden = true;
      Array.prototype.forEach.call(chipsEl.querySelectorAll('.chip'), function (c) { c.setAttribute('aria-pressed', 'false'); });

      if (existingNote) {
        modalTitle.textContent = 'Edit Note';
        editIdInput.value = existingNote.id;
        noteTextEl.value = existingNote.text;
        setSelectedColor(existingNote.color);
        sectionSelect.value = existingNote.section;
        sectionSelect.dataset.userTouched = 'true';
        if (existingNote.deadline) {
          deadlineToggle.checked = true;
          deadlineDetail.hidden = false;
          setSelectedDeadline(existingNote.deadline);
        }
      } else {
        modalTitle.textContent = 'New Note';
        editIdInput.value = '';
        setSelectedColor(nextColor());
        sectionSelect.value = 'todo';
      }

      overlay.hidden = false;
      setTimeout(function () { noteTextEl.focus(); }, 30);
    }

    function closeModal() {
      overlay.hidden = true;
    }

    document.getElementById('newNoteBtn').addEventListener('click', function () { openModal(null); });
    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    overlay.addEventListener('click', function (ev) { if (ev.target === overlay) closeModal(); });
    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !overlay.hidden) closeModal(); });

    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var text = noteTextEl.value.trim();
      if (!text) return;

      var id = editIdInput.value;
      var deadline = deadlineToggle.checked ? selectedDeadline : null;

      if (id) {
        var note = state.notes.find(function (n) { return n.id === id; });
        if (note) {
          note.text = text;
          note.color = selectedColor;
          note.section = sectionSelect.value;
          if (deadline !== note.deadline) note.autoPromoted = false;
          note.deadline = deadline;
        }
      } else {
        state.notes.unshift({
          id: uid(),
          text: text,
          color: selectedColor,
          section: sectionSelect.value,
          deadline: deadline,
          autoPromoted: false,
          createdAt: Date.now()
        });
      }

      closeModal();
      render();
      persist();
    });

    /* ---------- init ---------- */
    async function init() {
      state.notes = loadInitialNotes();
      try {
        artifactCap = await window.claude.use('artifact');
      } catch (e) {
        artifactCap = null;
      }
      refreshNotifyButton();
      render();
      setInterval(tick, 1000);
    }

    init();
  })();
  </script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
